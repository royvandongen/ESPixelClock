; PlatformIO build for the ESPixelClock firmware.
; Build:            pio run
; Filesystem image: pio run -t buildfs
; Both .bin files can be uploaded through the clock's /update page.

[platformio]
src_dir = examples/ESPixelClock
data_dir = examples/ESPixelClock/data
default_envs = espixelclock

[env:espixelclock]
; pioarduino platform = arduino-esp32 core 3.x (the official platform stops at 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

; Must match the partition table already on the clock: OTA cannot change it.
; app0/app1 1280 KB each, spiffs @ 0x290000.
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_build.f_flash = 80000000L
board_build.flash_mode = dio

monitor_speed = 115200

build_flags =
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1

lib_deps =
    fastled/FastLED@3.10.8
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    ayushsharma82/ElegantOTA@3.1.7
    sv-zanshin/DS3231M@1.0.8
    https://github.com/markbeee/SHT21.git#2c28aa98d9453f40560ae5d6b8d5f5c7a5e99c4f
